[versions]
testcontainers-redis = "2.2.4"
testcontainers = "1.21.4"
awssdk = "2.50.1"
# Redis Entra ID token 驗證的選用依賴（compileOnly，不外溢給下游）。
# 上游目前僅發布 beta：0.1.1-beta2 為 Maven Central 上的最新版本。
# 對應的 redis-authx-core 已由 lettuce-core 7.5.2 以傳遞依賴帶入，版號須與此一致。
redis-authx-entraid = "0.1.1-beta2"
# 以下兩項僅供 buildSrc（依賴閘門的建置邏輯）使用，不進入任何發布的 artifact。
# buildSrc 取不到 Spring Boot BOM，故版號必須寫死；junit 版號請與主專案由 BOM 解析出的版本一致。
tomlj = "1.1.1"
junit = "6.1.3"

[libraries]
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version.ref = "testcontainers-redis" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
lombok = { module = "org.projectlombok:lombok" }
redis-authx-entraid = { module = "redis.clients.authentication:redis-authx-entraid", version.ref = "redis-authx-entraid" }
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
awssdk-netty-nio-client = { module = "software.amazon.awssdk:netty-nio-client" }
# buildSrc 專用（依賴閘門）
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
