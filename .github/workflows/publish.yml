name: Publish

on:
  push:
    tags:
      - '*/v*'    # e.g. knolux-redis-spring-boot-starter/v1.0.1

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  test-and-publish:
    name: Test & Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Extract module and version from tag
        id: meta
        run: |
          TAG=${GITHUB_REF_NAME}
          MODULE=${TAG%/v*}
          VERSION=${TAG#*/v}
          echo "module=$MODULE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 建立整套依賴閘門賴以成立的不變量：**發布出去的版本，其外溢依賴集合必定等於當時簽入的
      # 基準線檔案**（FR-024）。少了這一步，後續所有以歷史基準線進行的比對都只是在比兩份
      # 可能都不真實的檔案。此處不套用閘門本體對非阻擋性落差的寬容——發布不可回收。
      #
      # 刻意排在測試之前：落差一旦存在就必須補基準線並重新打 tag，先跑完整測試只是白等。
      - name: Verify dependency baseline is current
        run: ./gradlew checkDependencyBaseline

      - name: Run module tests
        run: ./gradlew :${{ steps.meta.outputs.module }}:test

      - name: Publish to GitHub Packages
        run: ./gradlew :${{ steps.meta.outputs.module }}:publish -Pversion=${{ steps.meta.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
